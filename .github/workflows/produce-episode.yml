name: produce-episode

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Episode premise
        required: true
        default: "أسرار الحياة الحميمة في مصر القديمة: ماذا تكشف البرديات؟"
        type: string
      slug:
        description: Lowercase episode folder name
        required: true
        default: pharaoh-intimacy
        type: string
      duration:
        description: Episode length
        required: true
        default: short
        type: choice
        options:
          - short
          - long
      backend:
        description: Inference provider
        required: true
        default: codecraft
        type: choice
        options:
          - codecraft
          - radoxai
          - ollama-cloud
          - openrouter
      allow_elevenlabs:
        description: Explicitly authorize ElevenLabs voice and sound credits
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOPIC: ${{ inputs.topic }}
      SLUG: ${{ inputs.slug }}
      DURATION: ${{ inputs.duration }}
      ALLOW_ELEVENLABS: ${{ inputs.allow_elevenlabs }}
      CODECRAFT_API_KEY: ${{ secrets.CODECRAFT_API_KEY }}
      RADOXAI_API_KEY: ${{ secrets.RADOXAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      BACKEND: ${{ inputs.backend }}
      ELEVENLABS_API_KEY: ${{ inputs.allow_elevenlabs && secrets.ELEVENLABS_API_KEY || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and prepare agent workspace
        run: |
          [[ "$SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "::error::slug must contain lowercase letters, digits and dashes only"; exit 1; }
          test -n "$TOPIC" || { echo "::error::topic is required"; exit 1; }
          mkdir -p .opencode/agents .opencode/commands
          cp opencode/agents/*.md .opencode/agents/
          cp opencode/commands/*.md .opencode/commands/
          python - <<'PY'
          import os
          from pathlib import Path
          prompt = f"""Produce a complete StickMan Academy What If episode.

          Topic: {os.environ['TOPIC']}
          Slug: {os.environ['SLUG']}
          Language: Arabic
          Duration: {os.environ['DURATION']}
          Studio directory: ./studio
          Skill root: repository root (SKILL.md and scripts/ are here).

          Coordinate the specialist agents; do not merely write a plan. Follow SKILL.md and the references. Create the episode files in studio/src/episodes/{os.environ['SLUG']}/, run the validators, create and inspect the storyboard, and save all generated review outputs under studio/out/{os.environ['SLUG']}/. Use only original StickMan Academy characters. Keep the historical treatment educational and non-explicit; no nudity or sexualised imagery. Source every historical claim and mark uncertain interpretations clearly.

          ElevenLabs authorization: {os.environ['ALLOW_ELEVENLABS']}.
          If false, do not call voice, sfx, or any paid audio service. Finish at the storyboard/validation stage and report that audio/mastering remain pending. If true, use ELEVENLABS_API_KEY only for the requested episode, report actual credits, and continue through sound, mix and master if all prerequisites are met.

          Never publish or upload to YouTube. Never claim an MP4 exists unless it was actually rendered and verified. Final report must list the agents actually invoked, files created, validator results, and blockers."""
          Path("production-prompt.txt").write_text(prompt, encoding="utf-8")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render and image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libcups2 libdrm2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
          python -m pip install --upgrade pip numpy Pillow

      - name: Install Studio dependencies
        working-directory: studio
        run: |
          npm ci
          npx remotion browser ensure

      - name: Install OpenCode
        run: npm install --global opencode-ai@latest

      - name: Configure CodeCraft API Claude Opus 5.5
        if: inputs.backend == 'codecraft'
        run: |
          test -n "$CODECRAFT_API_KEY" || { echo "::error::Add CODECRAFT_API_KEY in repository Settings > Secrets and variables > Actions"; exit 1; }
          mkdir -p .opencode
          cat > .opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "codecraft": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "CodeCraft API",
                "options": {
                  "baseURL": "https://codecraftapi.com/v1",
                  "apiKey": "{env:CODECRAFT_API_KEY}"
                },
                "models": {
                  "claude-opus-5.5": {
                    "name": "Claude Opus 5.5",
                    "limit": { "context": 1000000, "output": 128000 }
                  }
                }
              }
            }
          }
          JSON
          echo "DIRECTOR_MODEL=codecraft/claude-opus-5.5" >> "$GITHUB_ENV"
          echo "WORKER_MODEL=codecraft/claude-opus-5.5" >> "$GITHUB_ENV"

      - name: Configure RadoxAI Claude Opus 5.5
        if: inputs.backend == 'radoxai'
        run: |
          test -n "$RADOXAI_API_KEY" || { echo "::error::Add RADOXAI_API_KEY in repository Settings > Secrets and variables > Actions"; exit 1; }
          mkdir -p .opencode
          cat > .opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "radoxai": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "RadoxAI",
                "options": {
                  "baseURL": "https://radoxai.com/v1",
                  "apiKey": "{env:RADOXAI_API_KEY}"
                },
                "models": {
                  "claude-opus-5.5": {
                    "name": "Claude Opus 5.5",
                    "limit": { "context": 1000000, "output": 128000 }
                  }
                }
              }
            }
          }
          JSON
          echo "DIRECTOR_MODEL=radoxai/claude-opus-5.5" >> "$GITHUB_ENV"
          echo "WORKER_MODEL=radoxai/claude-opus-5.5" >> "$GITHUB_ENV"

      - name: Configure Ollama Cloud free Gemma 4 31B
        if: inputs.backend == 'ollama-cloud'
        run: |
          test -n "$OLLAMA_API_KEY" || { echo "::error::Add OLLAMA_API_KEY in repository Settings > Secrets and variables > Actions"; exit 1; }
          mkdir -p .opencode
          cat > .opencode/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "ollama-cloud": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Ollama Cloud",
                "options": {
                  "baseURL": "https://ollama.com/v1",
                  "apiKey": "{env:OLLAMA_API_KEY}"
                },
                "models": {
                  "gemma4:31b-cloud": {
                    "name": "Gemma 4 31B Cloud",
                    "limit": { "context": 256000, "output": 32768 }
                  }
                }
              }
            }
          }
          JSON
          echo "DIRECTOR_MODEL=ollama-cloud/gemma4:31b-cloud" >> "$GITHUB_ENV"
          echo "WORKER_MODEL=ollama-cloud/gemma4:31b-cloud" >> "$GITHUB_ENV"

      - name: Configure OpenRouter GLM-5.3
        if: inputs.backend == 'openrouter'
        run: |
          test -n "$OPENROUTER_API_KEY" || { echo "::error::Add OPENROUTER_API_KEY in repository Settings > Secrets and variables > Actions"; exit 1; }
          echo "DIRECTOR_MODEL=openrouter/z-ai/glm-5.3" >> "$GITHUB_ENV"
          echo "WORKER_MODEL=openrouter/z-ai/glm-5.3-flash" >> "$GITHUB_ENV"

      - name: Bind specialist agents to selected provider
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          director = os.environ["DIRECTOR_MODEL"]
          worker = os.environ["WORKER_MODEL"]
          for path in Path(".opencode/agents").glob("*.md"):
              text = path.read_text(encoding="utf-8")
              model = director if path.stem == "wi-producer" else worker
              updated, n = re.subn(r"(?m)^model:.*$", f"model: {model}", text, count=1)
              if n:
                  path.write_text(updated, encoding="utf-8")
          PY
          opencode agent list

      - name: Run the production director
        run: |
          opencode run --agent wi-producer --model "$DIRECTOR_MODEL" --auto "$(cat production-prompt.txt)" 2>&1 | tee production.log

      - name: Verify generated episode
        if: always()
        run: |
          test -d "studio/src/episodes/$SLUG" || { echo "::error::Producer did not create studio/src/episodes/$SLUG"; exit 1; }
          test -s "studio/src/episodes/$SLUG/episode.json" || { echo "::error::episode.json is missing or empty"; exit 1; }
          cd studio
          python ../scripts/scriptcheck.py "$SLUG"
          npx tsc --noEmit
          node ../scripts/castcheck.mjs "$SLUG"
          node ../scripts/stills.mjs "$SLUG"
          python ../scripts/board.py "$SLUG"
          test -s "out/$SLUG/storyboard.jpg" || { echo "::error::Storyboard was not created"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-${{ inputs.slug }}
          path: |
            production-prompt.txt
            production.log
            studio/src/episodes/${{ inputs.slug }}/
            studio/out/${{ inputs.slug }}/
          if-no-files-found: warn
          retention-days: 14
