# The free agents' exam on GitHub's servers: the keyword researcher and the script writer run on each free OpenCode
# model with the same task and data, scripts grade every answer (keycheck.py, scriptcheck.py) and time it, and the
# fact checker reads the best script. No keys: OpenCode's free tier needs none. The results table is on the run's
# summary page; the briefs, scripts and logs are the run's artifact.
name: agents

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Seed phrases, comma-separated
        default: ماذا لو,ستيك مان
      region:
        description: YouTube region (two letters)
        default: SA
      models:
        description: Free models, comma-separated (":max" sets the reasoning level)
        default: opencode/glm-5.3-flash-free,opencode/deepseek-v4.1-flash-free:max

permissions:
  contents: read

jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEEDS: ${{ inputs.seeds }}
      REGION: ${{ inputs.region }}
      MODELS: ${{ inputs.models }}
      PYTHONUNBUFFERED: '1'  # show each agent's result in the log as it lands
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: OpenCode
        run: |
          npm install -g opencode-ai@latest
          opencode --version

      - name: Run the exam
        run: python scripts/agenttest.py --seeds "$SEEDS" --region "$REGION" --models "$MODELS" --work agent-test --timeout 900

      # the best YouTube package becomes a real thumbnail (drawn by the episode's own code, free) and a dry run of the
      # free YouTube tool shows exactly what it would write: nothing is sent to YouTube here
      - name: Thumbnail and YouTube dry run from the best package
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libcups2 libdrm2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
          BEST=$(python -c "import json;r=json.load(open('agent-test/results.json',encoding='utf-8'));p=[x for x in r.get('publish',[]) if x['score']>0];import re;print(re.sub(r'[^a-z0-9]+','-',max(p,key=lambda x:x['score'])['model'].split('/')[-1].split(':')[0].replace('-free','')) if p else '')")
          if [ -z "$BEST" ]; then echo "::warning::no publish package scored above 0"; exit 0; fi
          cd studio
          npm ci
          npx remotion browser ensure
          mkdir -p out/blink-swap
          cp ../agent-test/research/publish-$BEST.json out/blink-swap/publish.json
          npx tsc --noEmit
          node ../scripts/thumb.mjs blink-swap
          python ../scripts/youtube.py apply blink-swap --video dQw4w9WgXcQ --dry | tee out/blink-swap/youtube-dry-run.txt
          mkdir -p ../agent-test/thumbnail && cp out/blink-swap/thumbnail.* out/blink-swap/youtube-dry-run.txt ../agent-test/thumbnail/
          echo "Thumbnail drawn from publish-$BEST.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-test
          path: |
            agent-test/results.*
            agent-test/research/
            agent-test/logs/
            agent-test/thumbnail/
            agent-test/studio/src/episodes/test-*/
            agent-test/studio/out/
          retention-days: 14
