# The free agents' exam on GitHub's servers. The keyword researcher, the script writer and the publisher run on free
# models from GitHub Models (free for every GitHub account, reached with this run's own token: no key to set up),
# with the same task and the same live YouTube data; scripts grade every answer (keycheck, scriptcheck,
# publishcheck), send the failures back for up to three rounds, and time it. Then the best YouTube package becomes a
# drawn thumbnail and a dry run of the free YouTube tool. The table is on the run's summary page; every answer, check
# and the thumbnail are the run's artifact. (OpenCode's free tier doesn't answer from GitHub's servers: it is for
# running the agents on your own machine.)
name: agents

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Seed phrases, comma-separated
        default: ماذا لو,ستيك مان
      region:
        description: YouTube region (two letters)
        default: SA
      models:
        description: GitHub Models ids, comma-separated, or "auto" (two free models picked from the catalog)
        default: auto

permissions:
  contents: read
  models: read

jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEEDS: ${{ inputs.seeds }}
      REGION: ${{ inputs.region }}
      MODELS: ${{ inputs.models }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: A free model answers (one minute at most)
        run: |
          python scripts/llm.py --list | head -40
          timeout 60 python scripts/llm.py --model "$(python -c "import sys;sys.path.insert(0,'scripts');from llm import catalog;ids=catalog();print(next((i for i in ids if 'gpt-4.1-mini' in i or 'gpt-4o-mini' in i),ids[0]))")" "Reply with exactly: OK"

      - name: Run the exam
        run: python scripts/exam.py --seeds "$SEEDS" --region "$REGION" --models "$MODELS" --work exam --rounds 3

      # the best YouTube package becomes a real thumbnail (drawn by the episode's own code, free) and a dry run of the
      # free YouTube tool shows exactly what it would write: nothing is sent to YouTube here
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Thumbnail and YouTube dry run from the best package
        if: always()
        run: |
          BEST=$(python -c "import json,re;r=json.load(open('exam/results.json',encoding='utf-8'));p=[x for x in r.get('publish',[]) if x['score']>0];print(re.sub(r'[^a-z0-9]+','-',max(p,key=lambda x:x['score'])['model'].lower()).strip('-') if p else '')")
          if [ -z "$BEST" ]; then echo "::warning::no YouTube package scored above 0"; exit 0; fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libpango-1.0-0 libcairo2 libcups2 libdrm2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
          cd studio
          npm ci
          npx remotion browser ensure
          mkdir -p out/blink-swap
          cp ../exam/research/publish-$BEST.json out/blink-swap/publish.json
          npx tsc --noEmit
          node ../scripts/thumb.mjs blink-swap
          python ../scripts/youtube.py apply blink-swap --video dQw4w9WgXcQ --dry | tee out/blink-swap/youtube-dry-run.txt
          mkdir -p ../exam/thumbnail && cp out/blink-swap/thumbnail.* out/blink-swap/youtube-dry-run.txt ../exam/thumbnail/
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Thumbnail drawn from publish-$BEST.json (in the artifact, exam/thumbnail/)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exam
          path: |
            exam/results.*
            exam/research/
            exam/thumbnail/
            exam/studio/src/episodes/test-*/
            exam/studio/out/
          retention-days: 14
