name: retry-production

on:
  push:
    paths:
      - ".rerun-production"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the Pharaoh episode workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload=$(jq -n --arg topic "أسرار الحياة الحميمة في مصر القديمة: ماذا تكشف البرديات؟" '{
            ref: "main",
            inputs: {
              topic: $topic,
              slug: "pharaoh-intimacy",
              duration: "short",
              backend: "ollama-cloud",
              allow_elevenlabs: false
            }
          }')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/produce-episode.yml/dispatches" \
            -d "$payload"
          echo "Dispatched produce-episode with Ollama Cloud GLM-5.3; ElevenLabs disabled."
